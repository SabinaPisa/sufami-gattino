<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUFAMI 🐈‍⬛ 3 yosh!</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:20px}
h1{font-size:2.5em;margin:10px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.card{background:#1a1a1a;border-radius:20px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card p{padding:10px;margin:0}
button{background:#a3ff12;color:#000;border:none;padding:15px 25px;border-radius:30px;font-weight:bold;font-size:1.1em;margin:10px;cursor:pointer}
#gameArea{width:100%;height:300px;background:#151515;border-radius:20px;position:relative;overflow:hidden;margin:20px 0;border:2px dashed #333}
#mouse{font-size:30px;position:absolute;cursor:pointer;transition:0.2s}
.eyes-glow{filter:brightness(1.5) drop-shadow(0 0 15px #a3ff12);}
.cake{font-size:60px;margin:20px}
.candle{cursor:pointer;display:inline-block;margin:5px;transition:0.3s}
.candle.off{opacity:0.2;filter:grayscale(1)}
</style>
</head>
<body>
<h1>SUFAMI 🐈‍⬛✨</h1>
<p>3 yoshli - qora - yashil ko'zli gattino</p>

<div class="gallery">
<div class="card"><img id="img1" src="Screenshot_20260821-150843_Instagram.png"><p>Vannada 😹</p></div>
<div class="card"><img src="Screenshot_20260821-150850_Instagram.png"><p>Tili chiqqan 👅</p></div>
<div class="card"><img src="Screenshot_20260821-150843_Instagram.png"><p>Uxlayapti 💤</p></div>
<div class="card"><img id="mainCat" src="Screenshot_20260821-150850_Instagram.png"><p>Poylaydi 👀</p></div></div>

<button onclick="meow()">🎵 MIYOV! Bos!</button>
<button onclick="glow()">💚 Ko'zlari porlasin!</button>

<h2>🐭 O'yin: Sichqonni tut!</h2>
<p>Hisob: <span id="score">0</span></p>
<div id="gameArea"><div id="mouse">🐭</div></div>

<h2>🎂 Tug'ilgan kun! 3 yosh!</h2>
<div class="cake">
<span class="candle" onclick="blow(this)">🕯️</span>
<span class="candle" onclick="blow(this)">🕯️</span>
<span class="candle" onclick="blow(this)">🕯️</span>
</div>
<p>Shamlarni bosib o'chir! 🎉</p>
<p id="msg"></p>

<script>
let s=0;
function meow(){
let a=new Audio('https://cdn.pixabay.com/audio/2022/03/10/audio_c3a1a094a8.mp3');
a.play();
document.getElementById('mainCat').animate([{transform:'scale(1)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:300});
}
function glow(){
let c=document.getElementById('mainCat');
c.classList.toggle('eyes-glow');
if(c.classList.contains('eyes-glow')){document.body.style.background='#111a00'}else{document.body.style.background='#0a0a0a'}
}
const mouse=document.getElementById('mouse');
const area=document.getElementById('gameArea');
function moveMouse(){
mouse.style.left=Math.random()*85+'%';
mouse.style.top=Math.random()*80+'%';
}
mouse.onclick=()=>{s++;document.getElementById('score').innerText=s;moveMouse();if(s==5){alert('Sufami to'ydi! 🐈‍⬛🎉')}}
setInterval(moveMouse,1000);
moveMouse();
function blow(el){
el.classList.add('off');
el.innerText='💨';
let all=document.querySelectorAll('.candle.off').length;
if(all==3){document.getElementById('msg').innerText='🎉 BUON COMPLEANNO SUFAMI! 3 ANNI! 🎉'; confetti()}
}
function confetti(){for(let i=0;i<50;i++){let d=document.createElement('div');d.innerText='✨';d.style.position='fixed';d.style.left=Math.random()*100+'%';d.style.top='-10px';d.style.fontSize='20px';d.style.animation=`fall ${2+Math.random()*2}s linear`;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}
let style=document.createElement('style');style.innerHTML='[@keyframes](https://www.threads.net/@keyframes) fall{to{transform:translateY(100vh) rotate(360deg)}}';document.head.appendChild(style);
</script>
</body>
	</html>
